[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sallog"
version = "0.1.0"
description = "Selective small and large model collaboration for log anomaly detection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24,<3", "torch>=2.2,<3", "transformers>=4.40,<6",
  "scipy>=1.10,<2", "scikit-learn>=1.3,<2", "PyYAML>=6,<7",
  "joblib>=1.3,<2", "threadpoolctl>=3,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
sallog = "sallog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sallog = ["prompts/*.txt", "knowledge_cards/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

